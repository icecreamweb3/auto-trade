name: auto-trade-local

services:
  database:
    image: ${TIMESCALEDB_IMAGE:-timescale/timescaledb:latest-pg16}
    container_name: auto-trade-db
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - auto_trade_postgres_data:/var/lib/postgresql/data
      - ./database/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    shm_size: 1gb
    networks:
      - backend

  nats:
    image: ${NATS_IMAGE:-nats:2.15.0-alpine}
    container_name: auto-trade-nats
    restart: unless-stopped
    command: ["--config", "/etc/nats/nats-server.conf"]
    ports:
      - "127.0.0.1:${NATS_CLIENT_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - auto_trade_nats_data:/data
      - ./config/nats-server.conf:/etc/nats/nats-server.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/healthz | grep -q '\"status\":\"ok\"'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - backend

  db-migrate:
    image: ${TIMESCALEDB_IMAGE:-timescale/timescaledb:latest-pg16}
    profiles: ["tools"]
    restart: "no"
    environment:
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGTZ: UTC
    volumes:
      - ./database:/migrations:ro
    entrypoint: ["/bin/sh", "-ec"]
    command: ["/migrations/apply_migrations.sh"]
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend

  historical-rankings:
    profiles: ["tools"]
    build:
      context: .
      target: base
    image: auto-trade:local
    restart: "no"
    env_file: .env
    environment:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-127.0.0.1,localhost,database}
      TZ: UTC
    entrypoint: ["python", "-m", "auto_trade.collectors.historical_rankings"]
    depends_on:
      database:
        condition: service_healthy
    network_mode: host

  market-writer:
    profiles: ["runtime"]
    build:
      context: .
      target: base
    image: auto-trade:local
    container_name: auto-trade-market-writer
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      NATS_URL: nats://nats:4222
      TZ: UTC
    command: ["python", "-m", "auto_trade.writers.market_consumer", "run"]
    depends_on:
      database:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - backend

  collector:
    profiles: ["runtime"]
    build:
      context: .
      target: base
    image: auto-trade:local
    container_name: auto-trade-collector
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_PASSWORD: unused
      NATS_URL: nats://127.0.0.1:4222
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-127.0.0.1,localhost}
      TZ: UTC
    command: ["python", "-m", "auto_trade.collectors.scheduler"]
    network_mode: host
    depends_on:
      nats:
        condition: service_healthy

  data-repair:
    profiles: ["runtime"]
    image: auto-trade:local
    container_name: auto-trade-data-repair
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: 127.0.0.1
      NATS_URL: nats://127.0.0.1:4222
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-127.0.0.1,localhost}
      TZ: UTC
    command: ["python", "-m", "auto_trade.collectors.data_repair", "run"]
    network_mode: host
    depends_on:
      database:
        condition: service_healthy
      nats:
        condition: service_healthy

  monitor-api:
    profiles: ["runtime"]
    build:
      context: .
      target: base
    image: auto-trade:local
    container_name: auto-trade-monitor-api
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_NAME: collection-monitor
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      NATS_URL: nats://nats:4222
      TZ: UTC
    command:
      - uvicorn
      - auto_trade.monitoring.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      database:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - backend

  monitor-ui:
    profiles: ["runtime"]
    build:
      context: ./monitoring-ui
    image: auto-trade-monitor-ui:local
    container_name: auto-trade-monitor-ui
    restart: unless-stopped
    ports:
      - "${MONITOR_BIND_IP:-127.0.0.1}:${MONITOR_PORT:-8080}:80"
    depends_on:
      monitor-api:
        condition: service_healthy
    networks:
      - backend

volumes:
  auto_trade_postgres_data:
    name: auto-trade-postgres-data
  auto_trade_nats_data:
    name: auto-trade-nats-data

networks:
  backend:
    name: auto-trade-backend
    driver: bridge
