name: auto-trade-local

services:
  database:
    image: ${TIMESCALEDB_IMAGE:-timescale/timescaledb:latest-pg16}
    container_name: auto-trade-db
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - auto_trade_postgres_data:/var/lib/postgresql/data
      - ./database/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    shm_size: 1gb
    networks:
      - backend

  db-migrate:
    image: ${TIMESCALEDB_IMAGE:-timescale/timescaledb:latest-pg16}
    profiles: ["tools"]
    restart: "no"
    environment:
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGTZ: UTC
    volumes:
      - ./database:/migrations:ro
    entrypoint: ["/bin/sh", "-ec"]
    command: ["psql --set=ON_ERROR_STOP=1 --file=/migrations/001_initial_schema.sql"]
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend

volumes:
  auto_trade_postgres_data:
    name: auto-trade-postgres-data

networks:
  backend:
    name: auto-trade-backend
    internal: true

